<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yaglot</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses such as /construction/ go to /construction; /privacy/ and /privacy-notice go to /privacy; /terms/ goes to /terms; /contact/ goes to /contact; /faqs/ goes to /faqs; anything else goes home
    var path = location.pathname;
    location.replace(path.indexOf('/construction') === 0 ? '/construction' : path.indexOf('/privacy') === 0 ? '/privacy' : path.indexOf('/terms') === 0 ? '/terms' : path.indexOf('/contact') === 0 ? '/contact' : path.indexOf('/faq') === 0 ? '/faqs' : '/');
  </script>
</head>
<body>
  <p><a href="/">Go to the Yaglot home page</a></p>
</body>
</html>

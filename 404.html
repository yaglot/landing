<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yaglot</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses such as /construction/ go to /construction; /privacy and /privacy-notice/ go to /privacy-notice; /terms/ goes to /terms; anything else goes home
    var path = location.pathname;
    location.replace(path.indexOf('/construction') === 0 ? '/construction' : path.indexOf('/privacy') === 0 ? '/privacy-notice' : path.indexOf('/terms') === 0 ? '/terms' : '/');
  </script>
</head>
<body>
  <p><a href="/">Go to the Yaglot home page</a></p>
</body>
</html>

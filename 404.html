<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yaglot</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses such as /construction/ or /privacy/index.html go to /construction or /privacy; anything else goes home
    var path = location.pathname;
    location.replace(path.indexOf('/construction') === 0 ? '/construction' : path.indexOf('/privacy') === 0 ? '/privacy' : '/');
  </script>
</head>
<body>
  <p><a href="/">Go to the Yaglot home page</a></p>
</body>
</html>
